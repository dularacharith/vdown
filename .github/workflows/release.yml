name: Release Mobile APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish GitHub Release with APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify APK Asset
        run: |
          if [ ! -f "vdown.apk" ]; then
            echo "Error: vdown.apk not found in repository root!"
            exit 1
          fi
          echo "Found vdown.apk ($(ls -lh vdown.apk | awk '{print $5}'))"

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="v2.0.0"
          fi
          echo "Target Release Tag: ${TAG}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Updating notes and uploading vdown.apk..."
            gh release edit "${TAG}" --title "VDown Release ${TAG}" --notes-file .github/release_notes.md
            gh release upload "${TAG}" vdown.apk --clobber
          else
            echo "Creating new GitHub Release for ${TAG}..."
            gh release create "${TAG}" vdown.apk \
              --title "VDown Release ${TAG}" \
              --notes-file .github/release_notes.md || gh release upload "${TAG}" vdown.apk --clobber
          fi

          echo "Release ${TAG} published successfully with vdown.apk!"
