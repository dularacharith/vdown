name: Build and Release VDown (APK & Windows EXE)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish GitHub Release with APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify APK Asset
        run: |
          if [ ! -f "vdown.apk" ]; then
            echo "Error: vdown.apk not found in repository root!"
            exit 1
          fi
          echo "Found vdown.apk ($(ls -lh vdown.apk | awk '{print $5}'))"

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "${TAG}" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="v2.0.0"
          fi
          echo "Target Release Tag: ${TAG}"

          # Ensure the release exists or create it
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Creating release ${TAG}..."
            gh release create "${TAG}" --title "VDown Release ${TAG}" --notes-file .github/release_notes.md
          fi

          echo "Updating release notes and uploading vdown.apk..."
          gh release edit "${TAG}" --title "VDown Release ${TAG}" --notes-file .github/release_notes.md
          gh release upload "${TAG}" vdown.apk --clobber

          echo "Release ${TAG} current assets:"
          gh release view "${TAG}"

  build-windows-exe:
    name: Build Standalone Windows Executable
    runs-on: windows-latest
    needs: publish-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller pycryptodomex
          python -m pip install -e .

      - name: Build Standalone Windows Executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "vdown" \
            --icon "assets/icon.ico" \
            --collect-all "simple_downloader" \
            --collect-all "yt_dlp" \
            simple_downloader/gui/app.py

      - name: Verify Executable Built
        shell: bash
        run: |
          if [ ! -f "dist/vdown.exe" ]; then
            echo "Error: dist/vdown.exe was not created!"
            exit 1
          fi
          echo "Windows executable created successfully:"
          ls -lh dist/vdown.exe

      - name: Upload vdown.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdown-windows-exe
          path: dist/vdown.exe

      - name: Upload vdown.exe to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "${TAG}" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="v2.0.0"
          fi
          echo "Target Release Tag: ${TAG}"
          echo "Uploading dist/vdown.exe to release ${TAG}..."
          gh release upload "${TAG}" dist/vdown.exe --clobber
          echo "Release ${TAG} all assets:"
          gh release view "${TAG}"
