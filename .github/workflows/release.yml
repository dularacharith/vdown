name: Release Mobile APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish GitHub Release with APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify APK Asset
        run: |
          if [ ! -f "vdown.apk" ]; then
            echo "Error: vdown.apk not found in repository root!"
            exit 1
          fi
          echo "Found vdown.apk ($(ls -lh vdown.apk | awk '{print $5}'))"

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="v2.0.0"
          fi
          echo "Target Release Tag: ${TAG}"

          RELEASE_TITLE="VDown Release ${TAG}"
          RELEASE_NOTES="## VDown Release ${TAG}

A versatile media downloader available as both a Python CLI and a native Android companion app.

### 🌟 What's New
- 📱 **Native Android Companion App**: Full Material Design 3 app featuring dark/AMOLED theme, background downloading, in-app media player, and gallery integration.
- ⚡ **Facebook Videos & Reels Engine**: Direct extraction of HD/SD CDN streams from Facebook reels, videos, and mobile \`/share/r/\` & \`/share/v/\` links without requiring login.
- 🔗 **Android System Share Sheet**: Share any video or Reel directly from Facebook, TikTok, Instagram, YouTube, or web browsers to VDown for instant one-tap downloading.
- 🎵 **Studio-Quality Audio Extraction**: 320 kbps MP3, Lossless FLAC, M4A, and WAV extraction.
- 🎬 **TikTok Watermark-Free Engine**: Clean MP4 video downloads and HD photo slideshows.

### 📥 Downloads
- **Android APK**: Download [**vdown.apk**](https://github.com/dularacharith/vdown/releases/download/${TAG}/vdown.apk) to install directly on your Android device.

---
### 💻 Desktop Installation
\`\`\`bash
git clone https://github.com/dularacharith/vdown.git
cd vdown
./install.sh   # Linux / macOS
install.bat    # Windows
\`\`\`"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Updating notes and uploading vdown.apk..."
            gh release edit "${TAG}" --title "${RELEASE_TITLE}" --notes "${RELEASE_NOTES}"
            gh release upload "${TAG}" vdown.apk --clobber
          else
            echo "Creating new GitHub Release for ${TAG}..."
            gh release create "${TAG}" vdown.apk \
              --title "${RELEASE_TITLE}" \
              --notes "${RELEASE_NOTES}" || gh release upload "${TAG}" vdown.apk --clobber
          fi

          echo "Release ${TAG} published successfully with vdown.apk!"
