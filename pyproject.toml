[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-downloader"
version = "2.0.0"
description = "A versatile video and media downloader available as CLI and desktop GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "PyQt6>=6.5.0",
]

[project.scripts]
vdown = "simple_downloader.cli:main"
vdown-gui = "simple_downloader.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
