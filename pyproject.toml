[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-downloader"
version = "1.0.0"
description = "A versatile, feature-packed CLI video and media downloader"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "mutagen>=1.47.0"
]

[project.scripts]
vdown = "simple_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["."]
